site_name: Basic UI Application
site_description: Reusable multi-UI application framework (Pyside6-UI)
site_url: https://github.com/CrippledTrack/Pyside6-UI
repo_url: https://github.com/CrippledTrack/Pyside6-UI
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Plugins: plugins.md
  - API:
      - Plugin interfaces: api/plugin-interfaces.md
      - Plugin base: api/plugin-base.md
      - Service interfaces: api/service-interfaces.md
      - UI abstractions: api/ui-abstractions.md
