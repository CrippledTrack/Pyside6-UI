# ---------------------------------------------------------------------------
# Build the MkDocs site and publish it to GitHub Pages
# ---------------------------------------------------------------------------
# Triggered on:
#   - Push to main (builds, then deploys)
#   - PR to main (strict build only — no deployment)
#   - Manual dispatch (workflow_dispatch)
#
# NOTE: mkdocstrings resolves identifiers such as `GUI.app.ui.abstractions`
# through `paths: [..]` in mkdocs.yml, so the checkout must live in a
# directory named "GUI" for the package to be importable from the site root.
#
# Only requirements-docs.txt is installed: mkdocstrings reads the source
# statically (griffe), so PySide6 is not needed to render the API pages.
# ---------------------------------------------------------------------------

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "plugin_system/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "plugin_system/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded doc builds on the same branch / PR
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest

    steps:
      # ----- Checkout into GUI/ so mkdocstrings can import the package -------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: GUI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GUI/requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GUI/requirements-docs.txt

      # ----- Strict build fails on broken nav links / unresolved refs --------
      - name: Build documentation
        working-directory: GUI
        run: python -m mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: GUI/site

  # ----- Publish (skipped for pull requests) -------------------------------
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Never cancel an in-flight deployment
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
